[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-protocol"
version = "0.1.0"
description = "AEGIS metadata library for agentic AI provenance and execution integrity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AEGIS contributors" }]
keywords = ["aegis", "ai", "provenance", "agents", "metadata", "attestation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/tleader2026/AEGIS-Protocol"
Repository = "https://github.com/tleader2026/AEGIS-Protocol"
Issues = "https://github.com/tleader2026/AEGIS-Protocol/issues"

[project.scripts]
aegis-runtime = "aegis.daemon:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
