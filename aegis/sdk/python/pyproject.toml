[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-protocol"
version = "0.1.0"
description = "AEGIS metadata library for agentic AI provenance and execution integrity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AEGIS contributors" }]
keywords = ["aegis", "ai", "provenance", "agents", "metadata", "attestation"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
