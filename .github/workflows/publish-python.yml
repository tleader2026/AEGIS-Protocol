name: Publish Python SDK

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-python:
    name: Publish aegis-protocol to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis/sdk/python
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: aegis/sdk/python/dist
